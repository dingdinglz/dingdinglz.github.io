<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">折扣回报与折扣因子</title>
  <desc id="desc">时间越远的奖励乘以越高次幂的折扣因子，折扣因子越大越重视未来</desc>
  <defs>
    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3159d8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2fa9aa"/>
    </marker>
  </defs>

  <rect width="1200" height="570" rx="32" fill="#f6f8fc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="600" y="57" text-anchor="middle" fill="#17233f" font-size="36" font-weight="850">Discounted Return：越远的奖励，权重越小</text>
    <rect x="250" y="84" width="700" height="64" rx="20" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/>
    <text x="600" y="126" text-anchor="middle" fill="#273652" font-size="28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Gₜ = Rₜ₊₁ + γRₜ₊₂ + γ²Rₜ₊₃ + γ³Rₜ₊₄ + ···</text>

    <path d="M115 253 H1095" stroke="url(#timeline)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="1100" y="288" text-anchor="end" fill="#64748b" font-size="19">时间向未来延伸</text>

    <g filter="url(#shadow)">
      <g transform="translate(145 253)">
        <circle r="50" fill="#3159d8"/>
        <text y="-5" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="850">Rₜ₊₁</text>
        <text y="27" text-anchor="middle" fill="#dce7ff" font-size="20">权重 1</text>
      </g>
      <g transform="translate(330 253)">
        <circle r="46" fill="#426cdb"/>
        <text y="-5" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="850">Rₜ₊₂</text>
        <text y="25" text-anchor="middle" fill="#e0e8ff" font-size="19">权重 γ</text>
      </g>
      <g transform="translate(515 253)">
        <circle r="42" fill="#4e82d4"/>
        <text y="-5" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="850">Rₜ₊₃</text>
        <text y="24" text-anchor="middle" fill="#e4efff" font-size="18">权重 γ²</text>
      </g>
      <g transform="translate(700 253)">
        <circle r="39" fill="#4599c6"/>
        <text y="-5" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="850">Rₜ₊₄</text>
        <text y="23" text-anchor="middle" fill="#e5f7ff" font-size="17">权重 γ³</text>
      </g>
      <g transform="translate(885 253)">
        <circle r="35" fill="#35adba"/>
        <text y="-4" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="850">Rₜ₊₅</text>
        <text y="21" text-anchor="middle" fill="#e4fffc" font-size="16">权重 γ⁴</text>
      </g>
      <g transform="translate(1045 253)">
        <circle r="30" fill="#2dc2ad"/>
        <text y="7" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="900">···</text>
      </g>
    </g>

    <g transform="translate(80 359)">
      <rect width="500" height="155" rx="25" fill="#fff8ed" stroke="#f0c173" stroke-width="2"/>
      <rect x="24" y="22" width="118" height="38" rx="19" fill="#ffdca0"/>
      <text x="83" y="49" text-anchor="middle" fill="#8d5109" font-size="21" font-weight="850">γ = 0.2</text>
      <text x="164" y="49" fill="#5e4a32" font-size="23" font-weight="750">更看重眼前</text>
      <text x="24" y="91" fill="#7c5b30" font-size="20">3 步后的 +1，今天只值：</text>
      <text x="284" y="93" fill="#b55a16" font-size="26" font-weight="900">0.2³ = 0.008</text>
      <rect x="24" y="116" width="452" height="15" rx="7.5" fill="#f5dfbf"/>
      <rect x="24" y="116" width="16" height="15" rx="7.5" fill="#e98535"/>
    </g>

    <g transform="translate(620 359)">
      <rect width="500" height="155" rx="25" fill="#edfbf8" stroke="#78d6c9" stroke-width="2"/>
      <rect x="24" y="22" width="118" height="38" rx="19" fill="#bbf2e8"/>
      <text x="83" y="49" text-anchor="middle" fill="#08736b" font-size="21" font-weight="850">γ = 0.9</text>
      <text x="164" y="49" fill="#315b57" font-size="23" font-weight="750">更在乎未来</text>
      <text x="24" y="91" fill="#315f59" font-size="20">3 步后的 +1，今天仍值：</text>
      <text x="284" y="93" fill="#0b8f82" font-size="26" font-weight="900">0.9³ = 0.729</text>
      <rect x="24" y="116" width="452" height="15" rx="7.5" fill="#cfeee9"/>
      <rect x="24" y="116" width="329" height="15" rx="7.5" fill="#20b6a6"/>
    </g>
  </g>
</svg>
